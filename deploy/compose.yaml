name: deepresearch
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set deploy/.env}
      POSTGRES_DB: deepresearch
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 5s
      timeout: 5s
      retries: 20
  milvus:
    image: milvusdb/milvus:v2.6.4
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus-data:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./user.yaml:/milvus/configs/user.yaml:ro
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 20
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    profiles: ["redis"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  milvus-data:
  redis-data:
