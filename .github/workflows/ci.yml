name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: python -m pip install python-dotenv==1.1.0
      - run: python scripts/audit_public.py --history
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir .local/wheels .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/agent_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/agent_front/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
